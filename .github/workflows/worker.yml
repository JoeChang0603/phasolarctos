name: Deploy Expense Worker

on:
  push:
    branches: [main]
    paths:
      - workers/expense-worker.js
      - wrangler.toml
      - .github/workflows/worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expense-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 31506cf8ff19495136e7067d0f54ecd7
