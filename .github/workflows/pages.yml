name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sync Notion expenses
        run: |
          if [ -n "$NOTION_TOKEN" ] && [ -n "$NOTION_DATABASE_ID" ]; then
            npm run sync:notion-expenses || echo "::warning::Notion expense sync failed; continuing with committed trip data."
          else
            echo "Skipping Notion expense sync because NOTION_TOKEN or NOTION_DATABASE_ID is not set."
          fi
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_PLAN_TAG: Recommendation,Recommandation
      - run: npm run build
        env:
          VITE_GOOGLE_MAPS_EMBED_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_EMBED_API_KEY }}
          VITE_GOOGLE_MAPS_STATIC_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_STATIC_API_KEY }}
          VITE_EXPENSE_API_URL: https://phasolarctos-expense-api.ftravel.workers.dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
